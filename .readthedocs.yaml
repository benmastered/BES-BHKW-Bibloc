# Read the Docs configuration file for MkDocs projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build PDF & ePub
formats:
  - pdf
  - epub
  - htmlzip
  
# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    build:
      # The default commands for generating the HTML and pdf formats will still run.
      htmlzip:
        - echo "Override default build command for htmlzip format"
        - mkdir -p $READTHEDOCS_OUTPUT/html/
        - sphinx-build -n -b text docs $READTHEDOCS_OUTPUT/html/
      pdf:
        - echo "Copy images and pdflatex"
        - mkdir -p $READTHEDOCS_OUTPUT/images/
        - cp -r ./_static/images/ $READTHEDOCS_OUTPUT/images/
        - sphinx-build -b latexpdf ./ $READTHEDOCS_OUTPUT/pdf
sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: false
  
#mkdocs:
#  configuration: mkdocs.yml
#  fail_on_warning: true

python:
  install:
  - requirements: docs/requirements.txt
